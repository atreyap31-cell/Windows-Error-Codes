<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Congratulations</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #fff;
      padding: 32px 40px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      max-width: 520px;
      text-align: center;
    }
    .answer-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 20px;
    }
    #answer {
      font-family: monospace;
      font-size: 1.2em;
      background: #eee;
      padding: 8px 14px;
      border-radius: 6px;
    }
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      background: #4a6cf7;
      color: #fff;
      cursor: pointer;
      font-size: 1em;
    }
    button:hover { background: #3a58d6; }
    #reveal {
      display: none;
      margin-top: 24px;
      color: #c0392b;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <p>Congratulations; you visited this link and have braincells.</p>
    <p>Here is your answer:</p>


    <div class="answer-row">
      <span id="answer">ANSWER</span>
      <button id="copyBtn">Copy</button>
    </div>


    <p id="reveal">
      JK, you thought it would be that easy just do this math equation,
      for X = 0: 4x + 2y = 8
    </p>
  </div>


  <script>
    document.getElementById("copyBtn").addEventListener("click", function () {
      var text = document.getElementById("answer").textContent;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).catch(function () {});
      }
      document.getElementById("reveal").style.display = "block";
    });
  </script>
</body>
</html>
